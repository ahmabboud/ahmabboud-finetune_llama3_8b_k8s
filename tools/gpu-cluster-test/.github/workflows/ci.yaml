name: GPU Cluster Test CI

on:
  push:
    paths:
      - 'tools/gpu-cluster-test/**'
  pull_request:
    paths:
      - 'tools/gpu-cluster-test/**'
  workflow_dispatch:
    inputs:
      registry:
        description: 'Container registry'
        required: true
        default: 'cr.eu-north1.nebius.cloud/gpu-cluster-test'
      tag:
        description: 'Image tag'
        required: true
        default: 'latest'

env:
  REGISTRY: ${{ github.event.inputs.registry || 'cr.eu-north1.nebius.cloud/gpu-cluster-test' }}
  IMAGE_NAME: gpu-cluster-test
  IMAGE_TAG: ${{ github.event.inputs.tag || github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linters
        run: pip install flake8 black isort
      
      - name: Run flake8
        run: flake8 tools/gpu-cluster-test/scripts/ --max-line-length=120
      
      - name: Check formatting
        run: black --check tools/gpu-cluster-test/scripts/

  build:
    name: Build Container
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: tools/gpu-cluster-test
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-syntax:
    name: Test Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets accelerate
      
      - name: Check syntax
        run: python -m py_compile tools/gpu-cluster-test/scripts/gpu_test.py
      
      - name: Run import test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'tools/gpu-cluster-test/scripts')
          from gpu_test import GPUClusterTest
          print('✓ Import successful')
          "

  validate-k8s:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Validate single-node manifest
        run: kubectl apply --dry-run=client -f tools/gpu-cluster-test/k8s/single-node-test.yaml
      
      - name: Validate multi-node manifest
        run: kubectl apply --dry-run=client -f tools/gpu-cluster-test/k8s/multi-node-test.yaml
