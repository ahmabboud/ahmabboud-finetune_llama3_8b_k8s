###############################################################################
# GPU Cluster Test - Multi-Node (2 nodes, 16 GPUs)
#
# Usage:
#   kubectl apply -f multi-node-test.yaml
#   kubectl logs -f gpu-cluster-test-0
#   kubectl delete statefulset gpu-cluster-test && \
#   kubectl delete svc gpu-cluster-test && \
#   kubectl delete configmap gpu-cluster-test-config
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: gpu-cluster-test
spec:
  clusterIP: None
  selector:
    app: gpu-cluster-test
  ports:
  - port: 29500
    name: nccl
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gpu-cluster-test
spec:
  serviceName: gpu-cluster-test
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: gpu-cluster-test
  template:
    metadata:
      labels:
        app: gpu-cluster-test
    spec:
      terminationGracePeriodSeconds: 10
      
      containers:
      - name: test
        image: nvcr.io/nvidia/pytorch:24.12-py3
        
        resources:
          requests:
            nvidia.com/gpu: "8"
          limits:
            nvidia.com/gpu: "8"
        
        securityContext:
          capabilities:
            add: [IPC_LOCK, SYS_RESOURCE]
        
        ports:
        - containerPort: 29500
        
        env:
          - name: GPUS_PER_NODE
            value: "8"
          - name: NNODES
            value: "2"
          - name: MASTER_ADDR
            value: "gpu-cluster-test-0.gpu-cluster-test"
          - name: MASTER_PORT
            value: "29500"
          - name: NCCL_DEBUG
            value: "INFO"
          - name: NCCL_IB_DISABLE
            value: "0"
        
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          ulimit -l unlimited
          
          NODE_RANK=$(echo $HOSTNAME | grep -oE '[0-9]+$')
          export NODE_RANK
          
          echo "=============================================="
          echo "GPU Cluster Test - Multi-Node"
          echo "=============================================="
          echo "Node: $HOSTNAME (rank $NODE_RANK/$NNODES)"
          echo "Master: $MASTER_ADDR:$MASTER_PORT"
          echo "=============================================="
          
          # Wait for all pods
          for i in $(seq 0 $((NNODES - 1))); do
            while ! getent hosts gpu-cluster-test-$i.gpu-cluster-test > /dev/null 2>&1; do
              echo "Waiting for gpu-cluster-test-$i..."
              sleep 2
            done
            echo "✓ gpu-cluster-test-$i ready"
          done
          
          # Install dependencies
          pip install -q transformers datasets accelerate
          
          # Run distributed test
          torchrun \
            --nnodes=$NNODES \
            --nproc_per_node=$GPUS_PER_NODE \
            --node_rank=$NODE_RANK \
            --master_addr=$MASTER_ADDR \
            --master_port=$MASTER_PORT \
            /workspace/gpu_test.py --output /tmp/report.json
          
          # Print report from rank 0
          if [ "$NODE_RANK" = "0" ]; then
            echo ""
            echo "=== JSON REPORT ==="
            cat /tmp/report.json
            sleep 60
          else
            sleep 30
          fi

        volumeMounts:
        - name: test-script
          mountPath: /workspace/gpu_test.py
          subPath: gpu_test.py
      
      volumes:
      - name: test-script
        configMap:
          name: gpu-cluster-test-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-cluster-test-config
data:
  gpu_test.py: |
    #!/usr/bin/env python3
    """GPU Cluster Acceptance Test - Multi-Node Version"""
    
    import os, sys, time, json, socket, argparse, subprocess
    from datetime import datetime
    from dataclasses import dataclass, asdict
    from typing import List, Dict, Any, Optional
    
    @dataclass
    class TestResult:
        name: str
        passed: bool
        message: str
        details: Optional[Dict[str, Any]] = None
    
    class GPUClusterTest:
        GPU_FAMILIES = ["H100", "H200", "B100", "B200", "A100"]
        
        def __init__(self, args):
            self.args = args
            self.results: List[TestResult] = []
            self.rank = int(os.environ.get("RANK", 0))
            self.local_rank = int(os.environ.get("LOCAL_RANK", 0))
            self.world_size = int(os.environ.get("WORLD_SIZE", 1))
            self.is_distributed = self.world_size > 1
            self.cluster_info: Dict[str, Any] = {}
        
        def log(self, msg: str):
            if self.rank == 0: print(msg)
        
        def run_cmd(self, cmd, timeout=30):
            try:
                r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
                return r.returncode, r.stdout, r.stderr
            except: return -1, "", "error"
        
        def add_result(self, name, passed, message, details=None):
            self.results.append(TestResult(name, passed, message, details))
            if self.rank == 0:
                print(f"  {'✓' if passed else '✗'} {name}: {message}")
        
        def test_distributed_init(self):
            self.log("\n[1/6] Distributed Init...")
            import torch
            import torch.distributed as dist
            
            torch.cuda.set_device(self.local_rank)
            if not dist.is_initialized():
                dist.init_process_group(backend="nccl")
            
            # Verify all ranks
            world_tensor = torch.zeros(self.world_size, dtype=torch.int32, device="cuda")
            world_tensor[self.rank] = 1
            dist.all_reduce(world_tensor)
            all_present = world_tensor.sum().item() == self.world_size
            
            self.add_result("Distributed Init", all_present, f"World size {self.world_size}, all ranks present: {all_present}")
            return all_present
        
        def test_gpu_detection(self):
            self.log("\n[2/6] GPU Detection...")
            code, out, _ = self.run_cmd(["nvidia-smi", "--query-gpu=name,memory.total", "--format=csv,noheader"])
            if code != 0:
                self.add_result("GPU Detection", False, "nvidia-smi failed")
                return False
            
            gpus = [l.strip() for l in out.strip().split("\n") if l]
            gpu_family = "Unknown"
            for fam in self.GPU_FAMILIES:
                if gpus and fam in gpus[0]: gpu_family = fam; break
            
            self.cluster_info["gpu_family"] = gpu_family
            self.add_result("GPU Detection", len(gpus) >= 8, f"{len(gpus)}x {gpu_family}")
            return len(gpus) >= 8
        
        def test_memory_limits(self):
            self.log("\n[3/6] Memory Limits...")
            try:
                with open("/proc/1/limits") as f:
                    content = f.read()
                for line in content.split("\n"):
                    if "locked" in line.lower():
                        is_unlimited = "unlimited" in line
                        self.add_result("Memory Limits", is_unlimited, "memlock unlimited" if is_unlimited else "LIMITED")
                        return is_unlimited
            except: pass
            self.add_result("Memory Limits", False, "Could not check")
            return False
        
        def test_infiniband(self):
            self.log("\n[4/6] InfiniBand...")
            code, out, _ = self.run_cmd(["ibv_devinfo"])
            if code != 0:
                self.add_result("InfiniBand", True, "Not available (using Ethernet)")
                return True
            hcas = out.count("hca_id:")
            active = out.count("PORT_ACTIVE")
            self.add_result("InfiniBand", active > 0, f"{hcas} HCA(s), {active} active")
            return active > 0
        
        def test_allreduce_bandwidth(self):
            self.log("\n[5/6] AllReduce Bandwidth...")
            import torch
            import torch.distributed as dist
            
            device = f"cuda:{self.local_rank}"
            
            # Warmup
            tensor = torch.ones(1024, device=device)
            dist.all_reduce(tensor)
            torch.cuda.synchronize()
            dist.barrier()
            
            # Benchmark 256MB
            elements = 256 * 1024 * 1024 // 4
            tensor = torch.ones(elements, device=device)
            torch.cuda.synchronize()
            dist.barrier()
            
            t0 = time.time()
            for _ in range(10):
                dist.all_reduce(tensor)
            torch.cuda.synchronize()
            elapsed = (time.time() - t0) / 10
            
            data_gb = 2 * (self.world_size - 1) / self.world_size * 256 / 1024
            bandwidth = data_gb / elapsed
            
            self.cluster_info["allreduce_bandwidth_gbps"] = round(bandwidth, 1)
            self.add_result("AllReduce", bandwidth > 50, f"{bandwidth:.1f} GB/s (world={self.world_size})")
            return bandwidth > 50
        
        def test_training(self):
            self.log("\n[6/6] Distributed Training (GPT-2)...")
            import torch
            import torch.nn as nn
            import torch.distributed as dist
            
            device = f"cuda:{self.local_rank}"
            
            try:
                from transformers import GPT2Config, GPT2LMHeadModel
                config = GPT2Config(vocab_size=50257, n_positions=512, n_embd=768, n_layer=6, n_head=12)
                model = GPT2LMHeadModel(config).to(device)
                model = nn.parallel.DistributedDataParallel(model, device_ids=[self.local_rank])
                
                optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4)
                input_ids = torch.randint(0, 50257, (4, 512), device=device)
                
                # Warmup
                outputs = model(input_ids, labels=input_ids)
                outputs.loss.backward(); optimizer.step(); optimizer.zero_grad()
                torch.cuda.synchronize(); dist.barrier()
                
                # Benchmark
                torch.cuda.reset_peak_memory_stats()
                t0 = time.time()
                for _ in range(10):
                    outputs = model(input_ids, labels=input_ids)
                    outputs.loss.backward(); optimizer.step(); optimizer.zero_grad()
                torch.cuda.synchronize(); dist.barrier()
                
                step_ms = (time.time() - t0) / 10 * 1000
                throughput = 4 * 512 * self.world_size / (step_ms / 1000)
                mem_gb = torch.cuda.max_memory_allocated(device) / 1e9
                
                del model, optimizer; torch.cuda.empty_cache()
                self.add_result("Training", True, f"{step_ms:.0f}ms/step, {throughput:.0f} tok/s (global), {mem_gb:.1f}GB")
                return True
            except Exception as e:
                self.add_result("Training", False, str(e))
                return False
        
        def run(self):
            self.log("=" * 60)
            self.log("GPU CLUSTER ACCEPTANCE TEST - Multi-Node")
            self.log("=" * 60)
            self.log(f"Hostname: {socket.gethostname()}")
            self.log(f"World Size: {self.world_size}")
            self.log(f"Nodes: {self.world_size // 8}")
            self.log("=" * 60)
            
            self.test_distributed_init()
            self.test_gpu_detection()
            self.test_memory_limits()
            self.test_infiniband()
            self.test_allreduce_bandwidth()
            self.test_training()
            
            import torch.distributed as dist
            dist.barrier()
            
            passed = sum(1 for r in self.results if r.passed)
            failed = sum(1 for r in self.results if not r.passed)
            
            self.log("\n" + "=" * 60)
            self.log(f"PASSED: {passed}  FAILED: {failed}")
            self.log("=" * 60)
            self.log("✓ CLUSTER READY FOR DISTRIBUTED TRAINING" if failed == 0 else "✗ FIX FAILURES ABOVE")
            self.log("=" * 60)
            
            if self.rank == 0 and self.args.output:
                report = {"timestamp": datetime.now().isoformat(), "hostname": socket.gethostname(),
                          "world_size": self.world_size, "nodes": self.world_size // 8,
                          "passed": passed, "failed": failed,
                          "results": [asdict(r) for r in self.results], "cluster_info": self.cluster_info}
                with open(self.args.output, "w") as f: json.dump(report, f, indent=2)
            
            dist.barrier()
            return failed == 0
    
    if __name__ == "__main__":
        parser = argparse.ArgumentParser()
        parser.add_argument("--output", "-o")
        args = parser.parse_args()
        
        tester = GPUClusterTest(args)
        success = tester.run()
        
        import torch.distributed as dist
        if dist.is_initialized(): dist.destroy_process_group()
        sys.exit(0 if success else 1)
