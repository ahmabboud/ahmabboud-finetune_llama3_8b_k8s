---
# Smoke test job to validate training setup on GPU
# Run this before the full training to catch issues early
apiVersion: batch/v1
kind: Job
metadata:
  name: training-smoke-test
  namespace: default
spec:
  backoffLimit: 0  # Don't retry on failure
  ttlSecondsAfterFinished: 3600  # Cleanup after 1 hour
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        nebius.com/gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      
      containers:
        - name: smoke-test
          image: nvcr.io/nvidia/pytorch:24.01-py3
          
          # Request all 8 GPUs for full NCCL testing
          resources:
            requests:
              nvidia.com/gpu: "8"
              memory: "200Gi"
              cpu: "32"
            limits:
              nvidia.com/gpu: "8"
              memory: "400Gi"
              cpu: "64"
          
          # Required for InfiniBand RDMA (multi-node)
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: token
                  optional: true
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: api_key
                  optional: true
          
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "============================================="
              echo "FSDP + LoRA Training Smoke Test"
              echo "============================================="
              echo "Date: $(date)"
              echo "Hostname: $(hostname)"
              echo ""
              
              # Check GPU
              echo "GPU Information:"
              nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv
              echo ""
              
              # Install dependencies
              echo "Installing dependencies..."
              # Upgrade PyTorch first (container has old version)
              pip install -q --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
              pip install -q transformers datasets accelerate peft wandb trl pyyaml
              
              # Check versions
              echo ""
              echo "Package versions:"
              python -c "
              import torch
              import transformers
              import trl
              import peft
              import accelerate
              print(f'  torch: {torch.__version__}')
              print(f'  transformers: {transformers.__version__}')
              print(f'  trl: {trl.__version__}')
              print(f'  peft: {peft.__version__}')
              print(f'  accelerate: {accelerate.__version__}')
              print(f'  CUDA available: {torch.cuda.is_available()}')
              if torch.cuda.is_available():
                  print(f'  CUDA version: {torch.version.cuda}')
                  print(f'  GPU: {torch.cuda.get_device_name(0)}')
              "
              
              # Run comprehensive smoke test
              echo ""
              echo "============================================="
              echo "Running smoke test..."
              echo "============================================="
              
              python << 'SMOKE_TEST_EOF'
              import os
              import sys
              import tempfile
              
              def test_imports():
                  """Test all required imports."""
                  print("\n[1/8] Testing imports...")
                  try:
                      import torch
                      from transformers import AutoModelForCausalLM, AutoTokenizer
                      from trl import SFTTrainer, SFTConfig
                      from peft import LoraConfig, TaskType
                      from datasets import Dataset
                      print("  ✓ All imports successful")
                      return True
                  except Exception as e:
                      print(f"  ✗ Import failed: {e}")
                      return False
              
              def test_cuda():
                  """Test CUDA availability."""
                  print("\n[2/8] Testing CUDA...")
                  import torch
                  if not torch.cuda.is_available():
                      print("  ✗ CUDA not available")
                      return False
                  
                  # Simple CUDA test
                  x = torch.randn(100, 100, device="cuda")
                  y = torch.mm(x, x)
                  print(f"  ✓ CUDA working: {torch.cuda.get_device_name(0)}")
                  return True
              
              def test_model_loading():
                  """Test loading a small model with SDPA attention."""
                  print("\n[3/8] Testing model loading with SDPA...")
                  import torch
                  from transformers import AutoModelForCausalLM, AutoTokenizer
                  
                  try:
                      # Use GPT-2 for fast test
                      model = AutoModelForCausalLM.from_pretrained(
                          "gpt2",
                          torch_dtype=torch.bfloat16,
                          attn_implementation="sdpa",
                          device_map="cuda",
                      )
                      print(f"  ✓ Model loaded with SDPA attention")
                      del model
                      torch.cuda.empty_cache()
                      return True
                  except Exception as e:
                      print(f"  ✗ Model loading failed: {e}")
                      return False
              
              def test_peft_wrapping():
                  """Test PEFT LoRA wrapping."""
                  print("\n[4/8] Testing PEFT LoRA...")
                  import torch
                  from transformers import AutoModelForCausalLM
                  from peft import LoraConfig, TaskType, get_peft_model
                  
                  try:
                      model = AutoModelForCausalLM.from_pretrained(
                          "gpt2",
                          torch_dtype=torch.bfloat16,
                          device_map="cuda",
                      )
                      
                      lora_config = LoraConfig(
                          r=8,
                          lora_alpha=16,
                          target_modules=["c_attn"],
                          task_type=TaskType.CAUSAL_LM,
                      )
                      
                      peft_model = get_peft_model(model, lora_config)
                      trainable = sum(p.numel() for p in peft_model.parameters() if p.requires_grad)
                      print(f"  ✓ PEFT model created: {trainable:,} trainable params")
                      
                      del peft_model, model
                      torch.cuda.empty_cache()
                      return True
                  except Exception as e:
                      print(f"  ✗ PEFT wrapping failed: {e}")
                      return False
              
              def test_sft_config():
                  """Test SFTConfig creation."""
                  print("\n[5/8] Testing SFTConfig...")
                  from trl import SFTConfig
                  
                  try:
                      with tempfile.TemporaryDirectory() as tmpdir:
                          config = SFTConfig(
                              output_dir=tmpdir,
                              num_train_epochs=1,
                              max_steps=2,
                              per_device_train_batch_size=2,
                              learning_rate=1e-4,
                              warmup_steps=1,
                              bf16=True,
                              gradient_checkpointing=True,
                              gradient_checkpointing_kwargs={"use_reentrant": False},
                              max_length=128,
                              dataset_text_field="text",
                              report_to=["none"],
                          )
                          print(f"  ✓ SFTConfig created (max_length={config.max_length})")
                          return True
                  except Exception as e:
                      print(f"  ✗ SFTConfig failed: {e}")
                      return False
              
              def test_training_step():
                  """Test a single training step on GPU."""
                  print("\n[6/8] Testing training step...")
                  import torch
                  from transformers import AutoModelForCausalLM, AutoTokenizer
                  from peft import LoraConfig, TaskType
                  from trl import SFTTrainer, SFTConfig
                  from datasets import Dataset
                  
                  try:
                      with tempfile.TemporaryDirectory() as tmpdir:
                          # Tokenizer
                          tokenizer = AutoTokenizer.from_pretrained("gpt2")
                          tokenizer.pad_token = tokenizer.eos_token
                          
                          # Model
                          model = AutoModelForCausalLM.from_pretrained(
                              "gpt2",
                              torch_dtype=torch.bfloat16,
                          )
                          
                          # Dataset
                          dataset = Dataset.from_dict({
                              "text": ["Hello world"] * 20
                          })
                          
                          # Configs
                          peft_config = LoraConfig(
                              r=8,
                              lora_alpha=16,
                              target_modules=["c_attn"],
                              task_type=TaskType.CAUSAL_LM,
                          )
                          
                          sft_config = SFTConfig(
                              output_dir=tmpdir,
                              max_steps=2,
                              per_device_train_batch_size=2,
                              learning_rate=1e-4,
                              warmup_steps=1,
                              bf16=True,
                              gradient_checkpointing=False,
                              max_length=32,
                              dataset_text_field="text",
                              report_to=["none"],
                              logging_steps=1,
                          )
                          
                          # Train
                          trainer = SFTTrainer(
                              model=model,
                              processing_class=tokenizer,
                              args=sft_config,
                              train_dataset=dataset,
                              peft_config=peft_config,
                          )
                          
                          trainer.train()
                          print(f"  ✓ Training step completed on GPU")
                          
                          del trainer, model
                          torch.cuda.empty_cache()
                          return True
                  except Exception as e:
                      print(f"  ✗ Training step failed: {e}")
                      import traceback
                      traceback.print_exc()
                      return False
              
              def test_llama_tokenizer():
                  """Test Llama-3 tokenizer loading."""
                  print("\n[7/8] Testing Llama-3 tokenizer...")
                  from transformers import AutoTokenizer
                  import os
                  
                  try:
                      # Check if model is cached locally
                      local_path = "/mnt/data/models/llama3-8b-instruct"
                      if os.path.exists(local_path):
                          tokenizer = AutoTokenizer.from_pretrained(local_path)
                          print(f"  ✓ Llama-3 tokenizer loaded from local cache")
                      else:
                          # Try HuggingFace Hub
                          if os.getenv("HF_TOKEN"):
                              tokenizer = AutoTokenizer.from_pretrained(
                                  "meta-llama/Meta-Llama-3-8B-Instruct",
                                  token=os.getenv("HF_TOKEN")
                              )
                              print(f"  ✓ Llama-3 tokenizer loaded from HuggingFace")
                          else:
                              print(f"  ⚠ Skipped: No HF_TOKEN and no local cache")
                              return True  # Not a failure
                      return True
                  except Exception as e:
                      print(f"  ⚠ Llama-3 tokenizer test skipped: {e}")
                      return True  # Not critical
              
              def test_dataset_loading():
                  """Test loading preprocessed dataset."""
                  print("\n[8/10] Testing dataset loading...")
                  import os
                  
                  try:
                      train_path = "/mnt/data/cache/tokenized/train_fsdp"
                      if os.path.exists(train_path):
                          from datasets import load_from_disk
                          dataset = load_from_disk(train_path)
                          print(f"  ✓ Dataset loaded: {len(dataset)} samples")
                          return True
                      else:
                          print(f"  ⚠ No preprocessed dataset at {train_path}")
                          return True  # Not a failure
                  except Exception as e:
                      print(f"  ⚠ Dataset loading skipped: {e}")
                      return True
              
              def test_nccl_communication():
                  """Test NCCL multi-GPU communication."""
                  print("\n[9/10] Testing NCCL communication...")
                  import torch
                  
                  if not torch.cuda.is_available():
                      print("  ⚠ CUDA not available")
                      return True
                  
                  num_gpus = torch.cuda.device_count()
                  if num_gpus < 2:
                      print(f"  ⚠ Only {num_gpus} GPU, need 2+ for NCCL test")
                      return True
                  
                  # Check NCCL version
                  nccl_version = torch.cuda.nccl.version()
                  print(f"  ✓ NCCL version: {nccl_version}")
                  print(f"  ✓ GPUs available: {num_gpus}")
                  
                  # Test P2P access between GPUs
                  can_p2p = 0
                  for i in range(num_gpus):
                      for j in range(num_gpus):
                          if i != j and torch.cuda.can_device_access_peer(i, j):
                              can_p2p += 1
                  
                  print(f"  ✓ P2P access pairs: {can_p2p}/{num_gpus*(num_gpus-1)}")
                  return True
              
              def test_infiniband():
                  """Test InfiniBand availability."""
                  print("\n[10/10] Testing InfiniBand...")
                  import subprocess
                  
                  try:
                      result = subprocess.run(
                          ["ibv_devinfo"], 
                          capture_output=True, 
                          text=True, 
                          timeout=10
                      )
                      
                      if result.returncode == 0:
                          lines = result.stdout.split('\n')
                          devices = [l for l in lines if 'hca_id' in l]
                          active = result.stdout.count('PORT_ACTIVE')
                          print(f"  ✓ InfiniBand available")
                          print(f"    - HCA devices: {len(devices)}")
                          print(f"    - Active ports: {active}")
                          return True
                      else:
                          print(f"  ⚠ InfiniBand not available")
                          return True  # Not a failure on single node
                  except Exception as e:
                      print(f"  ⚠ InfiniBand check skipped: {e}")
                      return True
              
              # Run all tests
              results = []
              results.append(("Imports", test_imports()))
              results.append(("CUDA", test_cuda()))
              results.append(("Model Loading", test_model_loading()))
              results.append(("PEFT LoRA", test_peft_wrapping()))
              results.append(("SFTConfig", test_sft_config()))
              results.append(("Training Step", test_training_step()))
              results.append(("Llama Tokenizer", test_llama_tokenizer()))
              results.append(("Dataset", test_dataset_loading()))
              results.append(("NCCL", test_nccl_communication()))
              results.append(("InfiniBand", test_infiniband()))
              
              # Summary
              print("\n" + "=" * 50)
              print("SMOKE TEST SUMMARY")
              print("=" * 50)
              
              passed = 0
              failed = 0
              for name, result in results:
                  status = "✓ PASS" if result else "✗ FAIL"
                  print(f"  {name}: {status}")
                  if result:
                      passed += 1
                  else:
                      failed += 1
              
              print(f"\n  Total: {passed} passed, {failed} failed")
              
              if failed > 0:
                  print("\n✗ SMOKE TEST FAILED!")
                  sys.exit(1)
              else:
                  print("\n✓ ALL TESTS PASSED! Ready for full training.")
                  sys.exit(0)
              
              SMOKE_TEST_EOF
      
      volumes:
        - name: data
          hostPath:
            path: /mnt/data
            type: Directory
