---
# ConfigMap for training configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: default
data:
  # Training hyperparameters
  train_config.yaml: |
    model:
      name: "meta-llama/Meta-Llama-3-8B-Instruct"
      local_path: "/mnt/data/models/llama3-8b-instruct"
    
    lora:
      r: 64
      lora_alpha: 128
      lora_dropout: 0.05
      target_modules: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
    
    data:
      train_path: "/mnt/data/datasets/train.jsonl"
      val_path: "/mnt/data/datasets/val.jsonl"
      max_seq_length: 2048
    
    training:
      output_dir: "/mnt/data/checkpoints/llama3-function-calling"
      num_train_epochs: 3
      per_device_train_batch_size: 4
      per_device_eval_batch_size: 4
      gradient_accumulation_steps: 4
      learning_rate: 1.5e-4
      lr_scheduler_type: "cosine"
      warmup_steps: 200  # ~3% of first epoch
      weight_decay: 0.01
      save_steps: 200
      eval_steps: 200
      logging_steps: 10
      save_total_limit: 3
      gradient_checkpointing: true
    
    wandb:
      enabled: true
      project: "llama3-function-calling"
      run_name: "h100-16x-fsdp-lora"
  
  # Accelerate FSDP config - based on official HuggingFace PEFT example
  # https://github.com/huggingface/peft/blob/main/examples/sft/configs/fsdp_config.yaml
  accelerate_config.yaml: |
    compute_environment: LOCAL_MACHINE
    debug: false
    distributed_type: FSDP
    downcast_bf16: 'no'
    fsdp_config:
      fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
      fsdp_backward_prefetch: BACKWARD_PRE
      fsdp_cpu_ram_efficient_loading: true
      fsdp_forward_prefetch: false
      fsdp_offload_params: false
      fsdp_sharding_strategy: FULL_SHARD
      fsdp_state_dict_type: SHARDED_STATE_DICT
      fsdp_sync_module_states: true
      fsdp_use_orig_params: false
    machine_rank: 0
    main_training_function: main
    mixed_precision: bf16
    num_machines: 2
    num_processes: 16
    rdzv_backend: static
    same_network: true
    tpu_env: []
    tpu_use_cluster: false
    tpu_use_sudo: false
    use_cpu: false
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: llama3-training
  namespace: default
spec:
  clusterIP: None
  selector:
    app: llama3-training
  ports:
    - name: nccl
      port: 29500
      targetPort: 29500
  publishNotReadyAddresses: true
---
# StatefulSet for stable network identity
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama3-training
  namespace: default
spec:
  serviceName: llama3-training
  replicas: 2  # 2 nodes = 16 GPUs
  podManagementPolicy: Parallel  # Start all pods at once
  selector:
    matchLabels:
      app: llama3-training
  template:
    metadata:
      labels:
        app: llama3-training
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      
      nodeSelector:
        nebius.com/gpu: "true"
      
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      
      containers:
        - name: trainer
          image: nvcr.io/nvidia/pytorch:24.07-py3
          imagePullPolicy: IfNotPresent
          
          # Required for InfiniBand RDMA - allows unlimited memory pinning
          # See: https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html#infiniband
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE  # Allows changing resource limits (ulimit)
          
          resources:
            requests:
              nvidia.com/gpu: 8
              memory: "200Gi"
              cpu: "32"
            limits:
              nvidia.com/gpu: 8
              memory: "400Gi"
              cpu: "64"
          
          volumeMounts:
            - name: data
              mountPath: /mnt/data
            - name: config
              mountPath: /config
            - name: shm
              mountPath: /dev/shm
          
          env:
            # Distributed training settings
            - name: MASTER_ADDR
              value: "llama3-training-0.llama3-training.default.svc.cluster.local"
            - name: MASTER_PORT
              value: "29500"
            - name: WORLD_SIZE
              value: "16"  # 2 nodes x 8 GPUs
            - name: NNODES
              value: "2"
            - name: NPROC_PER_NODE
              value: "8"
            # NCCL settings for InfiniBand
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_NET_GDR_LEVEL
              value: "5"
            - name: NCCL_IB_QPS_PER_CONNECTION
              value: "4"
            # Pod identity
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-token
                  key: key
          
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Set unlimited memlock for InfiniBand RDMA
              # Required for ibv_reg_mr and ibv_create_qp calls
              ulimit -l unlimited || echo "Warning: Could not set unlimited memlock"
              
              # Install dependencies (TRL + PEFT + FSDP - official HuggingFace approach)
              # Upgrade PyTorch to 2.4+ for FSDP register_fsdp_forward_method support
              pip install -q --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
              pip install -q transformers datasets accelerate peft wandb trl
              # Note: Using PyTorch SDPA instead of flash-attn to avoid recompilation
              
              # Set up working directory
              cd /mnt/data/app
              mkdir -p src configs
              
              # Copy configs from ConfigMap
              cp /config/train_config.yaml configs/train_config.yaml
              cp /config/accelerate_config.yaml configs/accelerate_config.yaml
              
              # Determine node rank from pod name (llama3-training-0 -> 0, llama3-training-1 -> 1)
              NODE_RANK=${POD_NAME##*-}
              
              # Update accelerate config with correct machine_rank
              sed -i "s/machine_rank: 0/machine_rank: ${NODE_RANK}/" configs/accelerate_config.yaml
              
              echo "============================================="
              echo "Node: ${NODE_RANK} / Pod: ${POD_NAME}"
              echo "Master: ${MASTER_ADDR}:${MASTER_PORT}"
              echo "World size: ${WORLD_SIZE} (${NNODES} nodes x ${NPROC_PER_NODE} GPUs)"
              echo "============================================="
              
              # Create train.py - based on official HuggingFace PEFT FSDP example
              # https://huggingface.co/docs/peft/accelerate/fsdp
              cat > src/train.py << 'TRAIN_EOF'
              #!/usr/bin/env python3
              """
              FSDP + LoRA Training with TRL SFTTrainer
              Based on: https://huggingface.co/docs/peft/accelerate/fsdp
              """
              import os
              import yaml
              from pathlib import Path
              import torch
              import wandb
              from datasets import load_dataset, Dataset
              from transformers import AutoModelForCausalLM, AutoTokenizer
              from peft import LoraConfig, TaskType
              from peft.utils.other import fsdp_auto_wrap_policy
              from trl import SFTTrainer, SFTConfig
              
              def main():
                  # Load config
                  config_path = os.environ.get("CONFIG_PATH", "/mnt/data/app/configs/train_config.yaml")
                  with open(config_path) as f:
                      config = yaml.safe_load(f)
                  
                  # Distributed info
                  local_rank = int(os.environ.get("LOCAL_RANK", 0))
                  world_rank = int(os.environ.get("RANK", 0))
                  world_size = int(os.environ.get("WORLD_SIZE", 1))
                  
                  print(f"[Rank {world_rank}/{world_size}] Starting FSDP + LoRA training")
                  
                  # Initialize wandb on rank 0
                  if world_rank == 0 and config.get("wandb", {}).get("enabled") and os.getenv("WANDB_API_KEY"):
                      wandb.init(
                          project=config["wandb"].get("project", "llama3-training"),
                          name=config["wandb"].get("run_name", "fsdp-lora"),
                          config=config
                      )
                  
                  # Model path
                  model_name = config["model"]["name"]
                  local_path = config["model"].get("local_path", "")
                  model_path = local_path if Path(local_path).exists() else model_name
                  print(f"[Rank {world_rank}] Loading model from {model_path}")
                  
                  # Tokenizer
                  tokenizer = AutoTokenizer.from_pretrained(model_path, trust_remote_code=True)
                  if tokenizer.pad_token is None:
                      tokenizer.pad_token = tokenizer.eos_token
                  tokenizer.padding_side = "right"
                  
                  # Model - FSDP handles sharding automatically
                  # Use sdpa (default) for attention as flash-attn needs recompilation for new PyTorch
                  model = AutoModelForCausalLM.from_pretrained(
                      model_path,
                      torch_dtype=torch.bfloat16,
                      trust_remote_code=True,
                      attn_implementation="sdpa",  # Use PyTorch SDPA instead of flash-attn
                      use_cache=False,  # Required for gradient checkpointing
                  )
                  
                  # LoRA config
                  lora_cfg = config.get("lora", {})
                  target_modules = lora_cfg.get("target_modules", "q_proj,k_proj,v_proj,o_proj")
                  if isinstance(target_modules, str):
                      target_modules = [m.strip() for m in target_modules.split(",")]
                  
                  peft_config = LoraConfig(
                      r=lora_cfg.get("r", 64),
                      lora_alpha=lora_cfg.get("lora_alpha", 128),
                      lora_dropout=lora_cfg.get("lora_dropout", 0.05),
                      target_modules=target_modules,
                      task_type=TaskType.CAUSAL_LM,
                      bias="none",
                  )
                  
                  # Load datasets
                  train_path = config["data"]["train_path"]
                  val_path = config["data"].get("val_path")
                  max_seq_length = config["data"].get("max_seq_length", 2048)
                  
                  # Data caching
                  cache_dir = "/mnt/data/cache/tokenized"
                  os.makedirs(cache_dir, exist_ok=True)
                  train_cache = f"{cache_dir}/train_fsdp"
                  val_cache = f"{cache_dir}/val_fsdp"
                  
                  import time
                  import fcntl
                  lock_file = f"{cache_dir}/.tokenize_fsdp.lock"
                  
                  def format_chat(example):
                      """Format messages using chat template"""
                      text = tokenizer.apply_chat_template(
                          example["messages"],
                          tokenize=False,
                          add_generation_prompt=False
                      )
                      return {"text": text}
                  
                  # Only rank 0 prepares data
                  if world_rank == 0:
                      with open(lock_file, 'w') as f:
                          fcntl.flock(f, fcntl.LOCK_EX)
                          
                          if not os.path.exists(f"{train_cache}/dataset_info.json"):
                              print(f"[Rank {world_rank}] Processing training data...")
                              train_data = load_dataset('json', data_files=train_path, split='train')
                              train_data = train_data.map(format_chat, remove_columns=["messages", "id"])
                              train_data.save_to_disk(train_cache)
                              print(f"[Rank {world_rank}] Cached {len(train_data)} training examples")
                              
                              if val_path and Path(val_path).exists():
                                  val_data = load_dataset('json', data_files=val_path, split='train')
                                  val_data = val_data.map(format_chat, remove_columns=["messages", "id"])
                                  val_data.save_to_disk(val_cache)
                                  print(f"[Rank {world_rank}] Cached {len(val_data)} validation examples")
                          else:
                              print(f"[Rank {world_rank}] Using cached data")
                          
                          fcntl.flock(f, fcntl.LOCK_UN)
                  else:
                      print(f"[Rank {world_rank}] Waiting for data cache...")
                      while not os.path.exists(f"{train_cache}/dataset_info.json"):
                          time.sleep(2)
                  
                  train_data = Dataset.load_from_disk(train_cache)
                  val_data = Dataset.load_from_disk(val_cache) if os.path.exists(f"{val_cache}/dataset_info.json") else None
                  print(f"[Rank {world_rank}] Loaded {len(train_data)} training examples")
                  
                  # Training config
                  training_cfg = config["training"]
                  sft_config = SFTConfig(
                      output_dir=training_cfg["output_dir"],
                      num_train_epochs=training_cfg.get("num_train_epochs", 3),
                      per_device_train_batch_size=training_cfg.get("per_device_train_batch_size", 4),
                      per_device_eval_batch_size=training_cfg.get("per_device_eval_batch_size", 4),
                      gradient_accumulation_steps=training_cfg.get("gradient_accumulation_steps", 4),
                      learning_rate=training_cfg.get("learning_rate", 1.5e-4),
                      lr_scheduler_type=training_cfg.get("lr_scheduler_type", "cosine"),
                      warmup_steps=training_cfg.get("warmup_steps", 200),
                      weight_decay=training_cfg.get("weight_decay", 0.01),
                      logging_steps=training_cfg.get("logging_steps", 10),
                      save_steps=training_cfg.get("save_steps", 200),
                      eval_strategy="steps" if val_data else "no",
                      eval_steps=training_cfg.get("eval_steps", 200) if val_data else None,
                      save_total_limit=training_cfg.get("save_total_limit", 3),
                      bf16=True,
                      gradient_checkpointing=training_cfg.get("gradient_checkpointing", True),
                      gradient_checkpointing_kwargs={"use_reentrant": False},
                      max_length=max_seq_length,
                      dataset_text_field="text",
                      report_to=["wandb"] if os.getenv("WANDB_API_KEY") else ["none"],
                      run_name=config.get("wandb", {}).get("run_name", "fsdp-lora"),
                      ddp_find_unused_parameters=False,
                  )
                  
                  # Create trainer - SFTTrainer handles PEFT+FSDP integration
                  trainer = SFTTrainer(
                      model=model,
                      processing_class=tokenizer,
                      args=sft_config,
                      train_dataset=train_data,
                      eval_dataset=val_data,
                      peft_config=peft_config,
                  )
                  
                  # IMPORTANT: Set FSDP auto wrap policy for PEFT
                  # This is required when fsdp_use_orig_params=False
                  # https://huggingface.co/docs/peft/accelerate/fsdp
                  if getattr(trainer.accelerator.state, "fsdp_plugin", None):
                      fsdp_plugin = trainer.accelerator.state.fsdp_plugin
                      fsdp_plugin.auto_wrap_policy = fsdp_auto_wrap_policy(trainer.model)
                  
                  # Print model info
                  trainer.accelerator.print(f"{trainer.model}")
                  if hasattr(trainer.model, "print_trainable_parameters"):
                      trainer.model.print_trainable_parameters()
                  
                  # Train
                  print(f"[Rank {world_rank}] Starting training...")
                  trainer.train()
                  
                  # Save final model
                  print(f"[Rank {world_rank}] Saving model...")
                  if trainer.is_fsdp_enabled:
                      trainer.accelerator.state.fsdp_plugin.set_state_dict_type("FULL_STATE_DICT")
                  trainer.save_model()
                  
                  print(f"[Rank {world_rank}] Training complete!")
              
              if __name__ == "__main__":
                  main()
              TRAIN_EOF
              
              # Wait for master to be ready (if not master)
              if [ "$NODE_RANK" != "0" ]; then
                echo "Waiting for master node..."
                python3 -c "
              import socket, time
              while True:
                  try:
                      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      s.settimeout(2)
                      s.connect(('${MASTER_ADDR}', ${MASTER_PORT}))
                      s.close()
                      print('Master is ready!')
                      break
                  except:
                      time.sleep(2)
              "
              fi
              
              # Launch training with accelerate
              accelerate launch \
                --config_file configs/accelerate_config.yaml \
                --main_process_ip ${MASTER_ADDR} \
                --main_process_port ${MASTER_PORT} \
                --machine_rank ${NODE_RANK} \
                --num_machines ${NNODES} \
                --num_processes ${WORLD_SIZE} \
                src/train.py
      
      volumes:
        - name: data
          hostPath:
            path: /mnt/data
            type: Directory
        - name: config
          configMap:
            name: training-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
