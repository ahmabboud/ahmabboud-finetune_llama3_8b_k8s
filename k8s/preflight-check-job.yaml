    def main():
        print("")
        results = []
        
        # Test training imports
        results.append(("Training imports", test_training_imports()))
        
        # Test configs
        results.append(("SFTConfig", test_sft_config()))
        results.append(("LoraConfig", test_lora_config()))
        
        # Test PEFT model
        results.append(("PEFT model", test_peft_model()))
        
        # Test dataset
        dataset = test_dataset()
        results.append(("Dataset", dataset is not None))
        
        # Test training step (key test!)
        if dataset:
            results.append(("Training step", test_training_step(dataset)))
        
        # Test Llama tokenizer from cache
        results.append(("Llama tokenizer", test_llama_tokenizer()))
        
        # Test training dataset
        results.append(("Training dataset", test_training_dataset()))
        
        # Summary
        print("")
        print("  " + "-" * 40)
        passed = sum(1 for _, r in results if r)
        failed = sum(1 for _, r in results if not r)
        
        if failed > 0:
            print(f"  {RED}Training pipeline: {passed} passed, {failed} failed{RESET}")
            return 1
        else:
            print(f"  {GREEN}Training pipeline: All {passed} checks passed!{RESET}")
            return 0
    
    
    if __name__ == "__main__":
        sys.exit(main())