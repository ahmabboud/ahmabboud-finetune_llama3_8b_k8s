---
# Job to download model weights
apiVersion: batch/v1
kind: Job
metadata:
  name: download-model
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: model-download
    spec:
      restartPolicy: Never
      
      containers:
        - name: downloader
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Installing huggingface_hub..."
              pip install -q huggingface_hub
              
              echo "Creating directories..."
              mkdir -p /mnt/data/models
              
              echo "Downloading Llama-3-8B-Instruct..."
              python -c "
              from huggingface_hub import snapshot_download
              import os
              
              snapshot_download(
                  repo_id='meta-llama/Meta-Llama-3-8B-Instruct',
                  local_dir='/mnt/data/models/llama3-8b-instruct',
                  token=os.environ.get('HF_TOKEN'),
                  ignore_patterns=['*.md', '*.txt'],
              )
              print('Download complete!')
              "
              
              echo "Model files:"
              ls -lh /mnt/data/models/llama3-8b-instruct/
          
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          
          volumeMounts:
            - name: shared-data
              mountPath: /mnt/data
      
      volumes:
        - name: shared-data
          hostPath:
            path: /mnt/data
            type: Directory
