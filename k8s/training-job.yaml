---
# ConfigMap for training configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: default
data:
  train_config.yaml: |
    model:
      name: "meta-llama/Meta-Llama-3-8B-Instruct"
      use_lora: true
      use_flash_attention: true
      torch_dtype: "bfloat16"
    
    lora:
      r: 64
      lora_alpha: 128
      lora_dropout: 0.05
      target_modules:
        - "q_proj"
        - "k_proj"
        - "v_proj"
        - "o_proj"
        - "gate_proj"
        - "up_proj"
        - "down_proj"
    
    data:
      train_path: "/mnt/data/datasets/train.jsonl"
      val_path: "/mnt/data/datasets/val.jsonl"
      max_length: 2048
    
    training:
      output_dir: "/mnt/data/checkpoints/llama3-function-calling"
      num_train_epochs: 3
      per_device_train_batch_size: 16
      per_device_eval_batch_size: 16
      gradient_accumulation_steps: 2
      learning_rate: 1.5e-4
      lr_scheduler_type: "cosine"
      warmup_ratio: 0.03
      weight_decay: 0.01
      save_steps: 200
      eval_steps: 200
      logging_steps: 10
      save_total_limit: 3
      gradient_checkpointing: true
      dataloader_num_workers: 4
      dataloader_pin_memory: true
    
    loss:
      completion_only: true
    
    deepspeed:
      config_path: "/mnt/data/app/src/training/deepspeed_config.json"
    
    wandb:
      enabled: true
      project: "llama3-function-calling"
      run_name: "h100-16x-lora"
---
# Multi-node training Job
apiVersion: batch/v1
kind: Job
metadata:
  name: llama3-training
  namespace: default
spec:
  completions: 2  # Number of nodes
  parallelism: 2  # Run in parallel
  completionMode: Indexed
  template:
    metadata:
      labels:
        app: llama3-training
    spec:
      restartPolicy: Never
      
      # Schedule on GPU nodes
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      
      # For NCCL multi-node communication
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      
      containers:
        - name: trainer
          image: nvcr.io/nvidia/pytorch:24.07-py3
          imagePullPolicy: IfNotPresent
          
          env:
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_NET_GDR_LEVEL
              value: "5"
            - name: MASTER_ADDR
              value: "llama3-training-0.llama3-training"
            - name: MASTER_PORT
              value: "29500"
            - name: WORLD_SIZE
              value: "16"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-token
                  key: key
          
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Install dependencies
              pip install -q transformers datasets accelerate peft deepspeed wandb bitsandbytes
              pip install -q flash-attn --no-build-isolation
              
              # Set up working directory
              cd /mnt/data/app
              
              # Create training module if not exists
              mkdir -p src/training
              
              # Create __init__.py
              cat > src/training/__init__.py << 'INIT_EOF'
              from .trainer import DistributedTrainer
              from .lora_config import get_lora_config
              __all__ = ["DistributedTrainer", "get_lora_config"]
              INIT_EOF
              
              # Create lora_config.py
              cat > src/training/lora_config.py << 'LORA_EOF'
              from peft import LoraConfig, TaskType
              
              def get_lora_config(r=64, lora_alpha=128, lora_dropout=0.05, target_modules=None, **kwargs):
                  if target_modules is None:
                      target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
                  return LoraConfig(
                      r=r, lora_alpha=lora_alpha, lora_dropout=lora_dropout,
                      target_modules=target_modules, task_type=TaskType.CAUSAL_LM, bias="none"
                  )
              LORA_EOF
              
              # Create deepspeed config
              cat > src/training/deepspeed_config.json << 'DS_EOF'
              {
                "bf16": {"enabled": true},
                "zero_optimization": {
                  "stage": 2,
                  "allgather_partitions": true,
                  "allgather_bucket_size": 5e8,
                  "overlap_comm": true,
                  "reduce_scatter": true,
                  "reduce_bucket_size": 5e8,
                  "contiguous_gradients": true
                },
                "gradient_accumulation_steps": "auto",
                "gradient_clipping": 1.0,
                "train_batch_size": "auto",
                "train_micro_batch_size_per_gpu": "auto",
                "optimizer": {
                  "type": "AdamW",
                  "params": {"lr": "auto", "betas": [0.9, 0.999], "eps": 1e-8, "weight_decay": "auto"}
                },
                "scheduler": {
                  "type": "WarmupDecayLR",
                  "params": {"warmup_min_lr": 0, "warmup_max_lr": "auto", "warmup_num_steps": "auto", "total_num_steps": "auto"}
                }
              }
              DS_EOF
              
              # Create trainer.py
              cat > src/training/trainer.py << 'TRAINER_EOF'
              import os
              from pathlib import Path
              import torch
              from transformers import AutoModelForCausalLM, AutoTokenizer, TrainingArguments, Trainer, DataCollatorForLanguageModeling
              from peft import get_peft_model
              from .lora_config import get_lora_config
              
              class DistributedTrainer:
                  def __init__(self, model_name, output_dir, use_lora=True, lora_config=None,
                               use_flash_attention=True, torch_dtype="bfloat16", completion_only_loss=True):
                      self.model_name = model_name
                      self.output_dir = Path(output_dir)
                      self.use_lora = use_lora
                      self.lora_config = lora_config or {}
                      self.use_flash_attention = use_flash_attention
                      self.torch_dtype = getattr(torch, torch_dtype)
                      self.model = None
                      self.tokenizer = None
              
                  def setup(self):
                      print(f"Loading model: {self.model_name}")
                      self.tokenizer = AutoTokenizer.from_pretrained(self.model_name, trust_remote_code=True)
                      if self.tokenizer.pad_token is None:
                          self.tokenizer.pad_token = self.tokenizer.eos_token
                      
                      model_kwargs = {"torch_dtype": self.torch_dtype, "trust_remote_code": True}
                      if self.use_flash_attention:
                          model_kwargs["attn_implementation"] = "flash_attention_2"
                      
                      self.model = AutoModelForCausalLM.from_pretrained(self.model_name, **model_kwargs)
                      
                      if self.use_lora:
                          print("Applying LoRA")
                          lora_cfg = get_lora_config(**self.lora_config)
                          self.model = get_peft_model(self.model, lora_cfg)
                          self.model.print_trainable_parameters()
                      
                      self.model.gradient_checkpointing_enable()
                      return self
              
                  def get_training_args(self, num_train_epochs=3, per_device_train_batch_size=16,
                                        per_device_eval_batch_size=16, gradient_accumulation_steps=2,
                                        learning_rate=1.5e-4, warmup_ratio=0.03, logging_steps=10,
                                        save_steps=200, eval_steps=200, deepspeed_config=None, **kwargs):
                      return TrainingArguments(
                          output_dir=str(self.output_dir),
                          num_train_epochs=num_train_epochs,
                          per_device_train_batch_size=per_device_train_batch_size,
                          per_device_eval_batch_size=per_device_eval_batch_size,
                          gradient_accumulation_steps=gradient_accumulation_steps,
                          learning_rate=learning_rate, warmup_ratio=warmup_ratio,
                          logging_steps=logging_steps, save_steps=save_steps, eval_steps=eval_steps,
                          save_total_limit=3, save_safetensors=True,
                          evaluation_strategy="steps", load_best_model_at_end=True,
                          metric_for_best_model="eval_loss", greater_is_better=False,
                          bf16=True, tf32=True,
                          dataloader_num_workers=4, dataloader_pin_memory=True, group_by_length=True,
                          logging_dir=str(self.output_dir / "logs"),
                          report_to=["tensorboard", "wandb"],
                          deepspeed=deepspeed_config,
                          gradient_checkpointing=True, optim="adamw_torch_fused",
                          **{k:v for k,v in kwargs.items() if k not in ['output_dir', 'completion_only']}
                      )
              
                  def train(self, train_dataset, eval_dataset=None, training_args=None, resume_from_checkpoint=None):
                      if self.model is None:
                          self.setup()
                      if training_args is None:
                          training_args = self.get_training_args()
                      
                      data_collator = DataCollatorForLanguageModeling(tokenizer=self.tokenizer, mlm=False)
                      
                      self.trainer = Trainer(
                          model=self.model, args=training_args,
                          train_dataset=train_dataset, eval_dataset=eval_dataset,
                          data_collator=data_collator, tokenizer=self.tokenizer
                      )
                      
                      print("Starting training...")
                      self.trainer.train(resume_from_checkpoint=resume_from_checkpoint)
                      self.save()
                      return self.trainer
              
                  def save(self, path=None):
                      save_path = Path(path) if path else self.output_dir / "final"
                      save_path.mkdir(parents=True, exist_ok=True)
                      print(f"Saving to {save_path}")
                      self.model.save_pretrained(save_path)
                      self.tokenizer.save_pretrained(save_path)
              
                  def merge_and_save(self, path):
                      if not self.use_lora:
                          return
                      print(f"Merging LoRA and saving to {path}")
                      merged = self.model.merge_and_unload()
                      merged.save_pretrained(path)
                      self.tokenizer.save_pretrained(path)
              TRAINER_EOF
              
              # Create train.py script
              cat > scripts/train.py << 'TRAIN_EOF'
              #!/usr/bin/env python3
              import argparse, os, yaml, wandb
              import sys
              sys.path.insert(0, '/mnt/data/app')
              
              from transformers import AutoTokenizer
              from src.data import FunctionCallingDataset
              from src.data.dataset import load_local_dataset
              from src.training import DistributedTrainer
              
              def main():
                  parser = argparse.ArgumentParser()
                  parser.add_argument("--config", type=str, default="/config/train_config.yaml")
                  parser.add_argument("--resume", type=str, default=None)
                  parser.add_argument("--local_rank", type=int, default=-1)
                  args = parser.parse_args()
                  
                  with open(args.config) as f:
                      config = yaml.safe_load(f)
                  
                  rank = int(os.environ.get("RANK", 0))
                  is_main = rank == 0
                  
                  if is_main:
                      print("=" * 60)
                      print("Llama-3 Function Calling Fine-tuning")
                      print(f"World size: {os.environ.get('WORLD_SIZE', 1)}")
                      print("=" * 60)
                  
                  if is_main and config.get("wandb", {}).get("enabled", True):
                      wandb.init(project=config["wandb"].get("project"), name=config["wandb"].get("run_name"), config=config)
                  
                  model_name = config["model"]["name"]
                  tokenizer = AutoTokenizer.from_pretrained(model_name)
                  if tokenizer.pad_token is None:
                      tokenizer.pad_token = tokenizer.eos_token
                  
                  data_cfg = config["data"]
                  train_data = load_local_dataset(data_cfg["train_path"])
                  val_data = load_local_dataset(data_cfg["val_path"])
                  
                  train_dataset = FunctionCallingDataset(train_data, tokenizer, data_cfg.get("max_length", 2048))
                  val_dataset = FunctionCallingDataset(val_data, tokenizer, data_cfg.get("max_length", 2048))
                  
                  if is_main:
                      print(f"Train: {len(train_dataset)}, Val: {len(val_dataset)}")
                  
                  loss_cfg = config.get("loss", {})
                  
                  trainer = DistributedTrainer(
                      model_name=model_name,
                      output_dir=config["training"]["output_dir"],
                      use_lora=config["model"].get("use_lora", True),
                      lora_config=config.get("lora", {}),
                      use_flash_attention=config["model"].get("use_flash_attention", True),
                      torch_dtype=config["model"].get("torch_dtype", "bfloat16"),
                      completion_only_loss=loss_cfg.get("completion_only", True),
                  )
                  trainer.setup()
                  
                  training_args = trainer.get_training_args(
                      **config["training"],
                      deepspeed_config=config.get("deepspeed", {}).get("config_path")
                  )
                  
                  trainer.train(train_dataset, val_dataset, training_args, args.resume)
                  
                  if is_main and config["model"].get("use_lora"):
                      from pathlib import Path
                      trainer.merge_and_save(str(Path(config["training"]["output_dir"]) / "merged"))
                  
                  if is_main:
                      print("\nTraining complete!")
                      wandb.finish()
              
              if __name__ == "__main__":
                  main()
              TRAIN_EOF
              
              chmod +x scripts/train.py
              
              # Calculate node rank from pod index
              export NODE_RANK=$JOB_COMPLETION_INDEX
              export LOCAL_RANK=0
              
              echo "Starting training on node $NODE_RANK..."
              
              # Run training
              torchrun \
                --nproc_per_node=8 \
                --nnodes=2 \
                --node_rank=$NODE_RANK \
                --master_addr=$MASTER_ADDR \
                --master_port=$MASTER_PORT \
                scripts/train.py \
                --config /config/train_config.yaml
          
          resources:
            requests:
              nvidia.com/gpu: 8
              memory: "500Gi"
              cpu: "64"
            limits:
              nvidia.com/gpu: 8
              memory: "1000Gi"
              cpu: "128"
          
          volumeMounts:
            - name: shared-data
              mountPath: /mnt/data
            - name: config
              mountPath: /config
            - name: shm
              mountPath: /dev/shm
      
      volumes:
        - name: shared-data
          hostPath:
            path: /mnt/data
            type: Directory
        - name: config
          configMap:
            name: training-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
---
# Headless service for pod DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: llama3-training
  namespace: default
spec:
  clusterIP: None
  selector:
    app: llama3-training
  ports:
    - port: 29500
      name: nccl
