---
# Job to upload source code to shared storage
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-code
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: setup-code
    spec:
      restartPolicy: Never
      
      containers:
        - name: setup
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Setting up /mnt/data/app directory..."
              mkdir -p /mnt/data/app
              mkdir -p /mnt/data/datasets
              mkdir -p /mnt/data/models
              mkdir -p /mnt/data/checkpoints
              
              echo "Creating source code structure..."
              
              # Create src/data/__init__.py
              mkdir -p /mnt/data/app/src/data
              cat > /mnt/data/app/src/data/__init__.py << 'EOF'
              # Data processing module
              from .dataset import FunctionCallingDataset, load_xlam_dataset, load_glaive_dataset
              from .preprocessing import preprocess_for_training, create_chat_format, preprocess_glaive_dataset

              __all__ = [
                  "FunctionCallingDataset",
                  "load_xlam_dataset",
                  "load_glaive_dataset",
                  "preprocess_for_training",
                  "preprocess_glaive_dataset",
                  "create_chat_format",
              ]
              EOF

              # Create src/data/dataset.py
              cat > /mnt/data/app/src/data/dataset.py << 'DATASET_EOF'
              """Dataset loading and processing for function calling fine-tuning."""
              import json
              from typing import Dict, List, Optional, Any
              from pathlib import Path

              import torch
              from torch.utils.data import Dataset
              from datasets import load_dataset
              from transformers import PreTrainedTokenizer


              class FunctionCallingDataset(Dataset):
                  def __init__(self, data: List[Dict[str, Any]], tokenizer: PreTrainedTokenizer, 
                               max_length: int = 2048, include_labels: bool = True):
                      self.data = data
                      self.tokenizer = tokenizer
                      self.max_length = max_length
                      self.include_labels = include_labels
                  
                  def __len__(self) -> int:
                      return len(self.data)
                  
                  def __getitem__(self, idx: int) -> Dict[str, torch.Tensor]:
                      item = self.data[idx]
                      messages = item.get("messages", [])
                      
                      text = self.tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=False)
                      
                      encodings = self.tokenizer(text, truncation=True, max_length=self.max_length,
                                                  padding="max_length", return_tensors="pt")
                      
                      input_ids = encodings["input_ids"].squeeze(0)
                      attention_mask = encodings["attention_mask"].squeeze(0)
                      
                      result = {"input_ids": input_ids, "attention_mask": attention_mask}
                      
                      if self.include_labels:
                          labels = input_ids.clone()
                          labels[labels == self.tokenizer.pad_token_id] = -100
                          result["labels"] = labels
                      
                      return result


              def load_xlam_dataset(dataset_name: str = "Salesforce/xlam-function-calling-60k",
                                    split: str = "train", cache_dir: Optional[str] = None) -> List[Dict[str, Any]]:
                  import os
                  print(f"Loading dataset: {dataset_name}")
                  token = os.environ.get("HF_TOKEN")
                  dataset = load_dataset(dataset_name, split=split, cache_dir=cache_dir, token=token)
                  print(f"Loaded {len(dataset)} examples")
                  return list(dataset)


              def load_local_dataset(path: str) -> List[Dict[str, Any]]:
                  path = Path(path)
                  if path.suffix == ".jsonl":
                      data = []
                      with open(path, "r") as f:
                          for line in f:
                              data.append(json.loads(line))
                  else:
                      with open(path, "r") as f:
                          data = json.load(f)
                  print(f"Loaded {len(data)} examples from {path}")
                  return data


              def save_dataset(data: List[Dict[str, Any]], path: str) -> None:
                  path = Path(path)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with open(path, "w") as f:
                      for item in data:
                          f.write(json.dumps(item) + "\n")
                  print(f"Saved {len(data)} examples to {path}")


              def load_glaive_dataset(dataset_name: str = "glaiveai/glaive-function-calling-v2",
                                      split: str = "train", cache_dir: Optional[str] = None,
                                      max_samples: Optional[int] = None) -> List[Dict[str, Any]]:
                  print(f"Loading dataset: {dataset_name}")
                  if max_samples and "[" not in split:
                      split = f"{split}[:{max_samples}]"
                  dataset = load_dataset(dataset_name, split=split, cache_dir=cache_dir)
                  print(f"Loaded {len(dataset)} examples")
                  return list(dataset)
              DATASET_EOF

              # Create src/data/preprocessing.py
              cat > /mnt/data/app/src/data/preprocessing.py << 'PREPROCESS_EOF'
              """Data preprocessing utilities for function calling fine-tuning."""
              import json
              import re
              from typing import Dict, List, Any, Optional


              def parse_glaive_format(system: str, chat: str) -> List[Dict[str, str]]:
                  """Parse Glaive function calling format into chat messages."""
                  messages = []
                  system_content = system
                  if system_content.startswith("SYSTEM: "):
                      system_content = system_content[8:]
                  messages.append({"role": "system", "content": system_content.strip()})
                  
                  parts = re.split(r'\n\n+(?=USER:|ASSISTANT:|FUNCTION RESPONSE:)', chat)
                  for part in parts:
                      part = part.strip()
                      if not part:
                          continue
                      if part.startswith("USER:"):
                          content = part[5:].strip().replace("<|endoftext|>", "").strip()
                          if content:
                              messages.append({"role": "user", "content": content})
                      elif part.startswith("ASSISTANT:"):
                          content = part[10:].strip().replace("<|endoftext|>", "").strip()
                          if content:
                              messages.append({"role": "assistant", "content": content})
                      elif part.startswith("FUNCTION RESPONSE:"):
                          content = part[18:].strip().replace("<|endoftext|>", "").strip()
                          if content:
                              messages.append({"role": "tool", "content": content})
                  return messages


              def preprocess_glaive_dataset(examples: List[Dict[str, Any]], verbose: bool = True) -> List[Dict[str, Any]]:
                  """Preprocess Glaive function calling dataset."""
                  processed = []
                  skipped = 0
                  for i, example in enumerate(examples):
                      try:
                          system = example.get("system", "")
                          chat = example.get("chat", "")
                          if not system or not chat:
                              skipped += 1
                              continue
                          messages = parse_glaive_format(system, chat)
                          if len(messages) < 3:
                              skipped += 1
                              continue
                          processed.append({"messages": messages, "id": i})
                      except Exception as e:
                          if verbose and i < 10:
                              print(f"Error processing example {i}: {e}")
                          skipped += 1
                  if verbose:
                      print(f"Processed {len(processed)} examples, skipped {skipped}")
                  return processed


              def create_chat_format(query: str, tools: List[Dict[str, Any]], response: str,
                                     system_prompt: Optional[str] = None) -> List[Dict[str, str]]:
                  messages = []
                  if system_prompt is None:
                      system_prompt = create_system_prompt(tools)
                  messages.append({"role": "system", "content": system_prompt})
                  messages.append({"role": "user", "content": query})
                  messages.append({"role": "assistant", "content": response})
                  return messages


              def create_system_prompt(tools: List[Dict[str, Any]]) -> str:
                  tools_str = json.dumps(tools, indent=2)
                  return f"""You are a helpful assistant with access to tools. Use them when appropriate.

              Available tools:
              {tools_str}

              When using a tool, respond with JSON: {{"tool": "tool_name", "arguments": {{"arg": "value"}}}}"""


              def preprocess_for_training(examples: List[Dict[str, Any]], max_tools: int = 10,
                                          verbose: bool = True) -> List[Dict[str, Any]]:
                  processed = []
                  skipped = 0
                  
                  for i, example in enumerate(examples):
                      try:
                          query = example.get("query", example.get("instruction", ""))
                          tools = example.get("tools", example.get("functions", []))
                          answers = example.get("answers", example.get("response", ""))
                          
                          if not query or not answers:
                              skipped += 1
                              continue
                          
                          if len(tools) > max_tools:
                              tools = tools[:max_tools]
                          
                          if isinstance(answers, list):
                              response = json.dumps(answers, indent=2)
                          elif isinstance(answers, str):
                              response = answers
                          else:
                              response = json.dumps(answers)
                          
                          messages = create_chat_format(query=query, tools=tools, response=response)
                          processed.append({"messages": messages, "id": example.get("id", i)})
                      except Exception as e:
                          if verbose:
                              print(f"Error processing example {i}: {e}")
                          skipped += 1
                  
                  if verbose:
                      print(f"Processed {len(processed)} examples, skipped {skipped}")
                  return processed


              def split_dataset(data: List[Dict[str, Any]], train_ratio: float = 0.9, seed: int = 42) -> tuple:
                  import random
                  random.seed(seed)
                  shuffled = data.copy()
                  random.shuffle(shuffled)
                  split_idx = int(len(shuffled) * train_ratio)
                  train_data = shuffled[:split_idx]
                  val_data = shuffled[split_idx:]
                  print(f"Split: {len(train_data)} train, {len(val_data)} validation")
                  return train_data, val_data
              PREPROCESS_EOF

              # Create scripts directory
              mkdir -p /mnt/data/app/scripts

              # Create prepare_data.py
              cat > /mnt/data/app/scripts/prepare_data.py << 'PREPDATA_EOF'
              #!/usr/bin/env python3
              """Script to download and preprocess function calling datasets."""
              import argparse
              import sys
              sys.path.insert(0, '/mnt/data/app')

              from src.data.dataset import load_xlam_dataset, load_glaive_dataset, save_dataset
              from src.data.preprocessing import preprocess_for_training, preprocess_glaive_dataset, split_dataset


              def main():
                  parser = argparse.ArgumentParser(description="Prepare training data")
                  parser.add_argument("--dataset", type=str, default="glaiveai/glaive-function-calling-v2")
                  parser.add_argument("--format", type=str, choices=["xlam", "glaive"], default="glaive")
                  parser.add_argument("--output-dir", type=str, default="./data")
                  parser.add_argument("--cache-dir", type=str, default=None)
                  parser.add_argument("--train-ratio", type=float, default=0.95)
                  parser.add_argument("--max-samples", type=int, default=None)
                  parser.add_argument("--max-tools", type=int, default=10)
                  parser.add_argument("--seed", type=int, default=42)
                  args = parser.parse_args()
                  
                  from pathlib import Path
                  output_dir = Path(args.output_dir)
                  output_dir.mkdir(parents=True, exist_ok=True)
                  
                  print("=" * 50)
                  print("Data Preparation Pipeline")
                  print("=" * 50)
                  print(f"Dataset: {args.dataset}")
                  print(f"Format: {args.format}")
                  
                  print("\n[1/4] Loading dataset...")
                  if args.format == "glaive":
                      raw_data = load_glaive_dataset(dataset_name=args.dataset, cache_dir=args.cache_dir,
                                                     max_samples=args.max_samples)
                  else:
                      raw_data = load_xlam_dataset(dataset_name=args.dataset, cache_dir=args.cache_dir)
                      if args.max_samples:
                          raw_data = raw_data[:args.max_samples]
                  
                  print("\n[2/4] Preprocessing data...")
                  if args.format == "glaive":
                      processed_data = preprocess_glaive_dataset(raw_data, verbose=True)
                  else:
                      processed_data = preprocess_for_training(raw_data, max_tools=args.max_tools, verbose=True)
                  
                  print("\n[3/4] Splitting dataset...")
                  train_data, val_data = split_dataset(processed_data, train_ratio=args.train_ratio, seed=args.seed)
                  
                  print("\n[4/4] Saving processed data...")
                  save_dataset(train_data, output_dir / "train.jsonl")
                  save_dataset(val_data, output_dir / "val.jsonl")
                  
                  print("\n" + "=" * 50)
                  print("Data preparation complete!")
                  print(f"Training: {len(train_data)}, Validation: {len(val_data)}")


              if __name__ == "__main__":
                  main()
              PREPDATA_EOF

              # Create benchmark.py
              cat > /mnt/data/app/scripts/benchmark.py << 'BENCHMARK_EOF'
              #!/usr/bin/env python3
              """GPU benchmark script."""
              import os
              import time
              import torch
              import torch.distributed as dist


              def benchmark_matmul(size: int = 8192, iterations: int = 100) -> dict:
                  device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
                  a = torch.randn(size, size, device=device, dtype=torch.bfloat16)
                  b = torch.randn(size, size, device=device, dtype=torch.bfloat16)
                  
                  for _ in range(10):
                      torch.matmul(a, b)
                  torch.cuda.synchronize()
                  
                  start = time.perf_counter()
                  for _ in range(iterations):
                      torch.matmul(a, b)
                  torch.cuda.synchronize()
                  elapsed = time.perf_counter() - start
                  
                  flops = 2 * size**3 * iterations
                  tflops = flops / elapsed / 1e12
                  return {"operation": "MatMul", "tflops": round(tflops, 2)}


              def main():
                  local_rank = int(os.environ.get("LOCAL_RANK", -1))
                  if local_rank >= 0:
                      torch.cuda.set_device(local_rank)
                      dist.init_process_group(backend="nccl")
                      rank = dist.get_rank()
                  else:
                      rank = 0
                  
                  if rank == 0:
                      print("\n" + "="*50)
                      print(" GPU BENCHMARK")
                      print("="*50)
                      
                      if torch.cuda.is_available():
                          props = torch.cuda.get_device_properties(0)
                          print(f"GPU: {props.name}")
                          print(f"GPUs: {torch.cuda.device_count()}")
                          print(f"Memory: {props.total_memory / 1e9:.1f} GB")
                  
                  result = benchmark_matmul()
                  
                  if rank == 0:
                      print(f"\nMatMul TFLOPS: {result['tflops']}")
                      print("Expected H100: ~900-1000 TFLOPS")
                      print("="*50)
                  
                  if dist.is_initialized():
                      dist.destroy_process_group()


              if __name__ == "__main__":
                  main()
              BENCHMARK_EOF

              chmod +x /mnt/data/app/scripts/*.py
              
              echo ""
              echo "Setup complete! Directory structure:"
              find /mnt/data/app -type f
              echo ""
              echo "Storage usage:"
              df -h /mnt/data
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          
          volumeMounts:
            - name: shared-data
              mountPath: /mnt/data
      
      volumes:
        - name: shared-data
          hostPath:
            path: /mnt/data
            type: Directory
