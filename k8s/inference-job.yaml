###############################################################################
# Inference Job - Test the fine-tuned Llama-3 model
#
# This job loads the base model with LoRA weights from an FSDP checkpoint
# to test function calling capabilities learned during fine-tuning.
#
# Usage:
#   kubectl apply -f k8s/inference-job.yaml
#   kubectl logs -f job/llama3-inference
###############################################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: llama3-inference
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: llama3-inference
    spec:
      restartPolicy: Never
      
      containers:
      - name: inference
        image: nvcr.io/nvidia/pytorch:24.12-py3
        
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_HOME
            value: "/mnt/data/cache/huggingface"
          - name: BASE_MODEL
            value: "meta-llama/Meta-Llama-3-8B-Instruct"
          - name: CHECKPOINT_PATH
            value: "/mnt/data/checkpoints/llama3-function-calling/checkpoint-1000"
        
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "=============================================="
          echo "Llama-3 Function Calling - Inference Test"
          echo "=============================================="
          echo "Checkpoint: $CHECKPOINT_PATH"
          echo "Base Model: $BASE_MODEL"
          echo ""
          
          # Install compatible versions
          pip install -q "transformers==4.46.3" "peft==0.13.2" "accelerate==1.1.1"
          
          python3 << 'PYEOF'
          import os
          import torch
          from torch.distributed.checkpoint.format_utils import dcp_to_torch_save
          from transformers import AutoModelForCausalLM, AutoTokenizer
          from peft import LoraConfig, get_peft_model

          # Configuration
          BASE_MODEL = os.environ["BASE_MODEL"]
          CHECKPOINT_PATH = os.environ["CHECKPOINT_PATH"]
          LORA_CONFIG = LoraConfig(
              r=64,
              lora_alpha=128,
              lora_dropout=0.05,
              target_modules=["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"],
              bias="none",
              task_type="CAUSAL_LM",
          )

          def load_model():
              """Load base model with LoRA and FSDP checkpoint weights."""
              print("Loading tokenizer...")
              tokenizer = AutoTokenizer.from_pretrained(BASE_MODEL)
              tokenizer.pad_token = tokenizer.eos_token
              
              print(f"Loading base model: {BASE_MODEL}")
              model = AutoModelForCausalLM.from_pretrained(
                  BASE_MODEL,
                  torch_dtype=torch.bfloat16,
                  device_map="auto",
              )
              
              print("Applying LoRA configuration...")
              model = get_peft_model(model, LORA_CONFIG)
              
              # Load FSDP checkpoint
              fsdp_path = os.path.join(CHECKPOINT_PATH, "pytorch_model_fsdp_0")
              if os.path.exists(fsdp_path):
                  print(f"Loading FSDP checkpoint: {fsdp_path}")
                  temp_file = "/tmp/checkpoint.pt"
                  dcp_to_torch_save(fsdp_path, temp_file)
                  state_dict = torch.load(temp_file, map_location="cpu", weights_only=False)
                  model.load_state_dict(state_dict, strict=False)
                  print("Checkpoint loaded successfully!")
              else:
                  print(f"Warning: Checkpoint not found at {fsdp_path}")
              
              model.eval()
              return model, tokenizer

          def generate_response(model, tokenizer, system_prompt, user_message, max_tokens=256):
              """Generate a response for the given prompts."""
              messages = [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_message}
              ]
              prompt = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)
              inputs = tokenizer(prompt, return_tensors="pt").to(model.device)
              
              with torch.no_grad():
                  outputs = model.generate(
                      **inputs,
                      max_new_tokens=max_tokens,
                      temperature=0.1,
                      top_p=0.9,
                      do_sample=True,
                      pad_token_id=tokenizer.pad_token_id,
                      eos_token_id=tokenizer.eos_token_id,
                  )
              
              return tokenizer.decode(outputs[0][inputs['input_ids'].shape[1]:], skip_special_tokens=True)

          # Test cases
          TEST_CASES = [
              {
                  "name": "Weather Query",
                  "system": "You are a helpful assistant with access to functions:\n- get_weather(location: str, unit: str = 'celsius') -> dict",
                  "user": "What's the weather like in Paris?"
              },
              {
                  "name": "Unit Conversion", 
                  "system": "You are a helpful assistant with access to functions:\n- convert_units(value: float, from_unit: str, to_unit: str) -> float",
                  "user": "How many kilometers is 26.2 miles?"
              },
              {
                  "name": "Database Query",
                  "system": "You are a helpful assistant with access to functions:\n- search_database(query: str, table: str, limit: int = 10) -> list",
                  "user": "Find me the top 5 users who signed up this month"
              },
              {
                  "name": "No Function Needed",
                  "system": "You are a helpful assistant with access to functions:\n- send_email(to: str, subject: str, body: str) -> bool",
                  "user": "What is the capital of France?"
              },
          ]

          def main():
              model, tokenizer = load_model()
              print(f"\nModel ready on {model.device}")
              
              print("\n" + "=" * 60)
              print("Running Inference Tests")
              print("=" * 60)
              
              for i, test in enumerate(TEST_CASES, 1):
                  print(f"\n{'='*60}")
                  print(f"Test {i}: {test['name']}")
                  print("=" * 60)
                  print(f"User: {test['user']}")
                  print("-" * 40)
                  
                  response = generate_response(model, tokenizer, test["system"], test["user"])
                  print(f"Assistant: {response}")
              
              print("\n" + "=" * 60)
              print("Inference test completed!")
              print("=" * 60)
              
              if torch.cuda.is_available():
                  print(f"Peak GPU Memory: {torch.cuda.max_memory_allocated() / 1e9:.1f} GB")

          if __name__ == "__main__":
              main()
          PYEOF
          
          echo ""
          echo "Done at $(date)"

        volumeMounts:
        - name: shared-data
          mountPath: /mnt/data
      
      volumes:
      - name: shared-data
        hostPath:
          path: /mnt/data
          type: Directory
