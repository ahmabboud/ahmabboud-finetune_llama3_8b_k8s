###############################################################################
# Ray Training Job - Llama-3 Function Calling Fine-tuning
#
# This submits a distributed training job to KubeRay using Ray Train.
# Uses the same LoRA + FSDP configuration as the StatefulSet training.
#
# Usage:
#   kubectl apply -f k8s/ray-training-job.yaml
#   kubectl logs -f rayjob-llama3-training-xxxxx -n ray-cluster
###############################################################################
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: llama3-finetuning
  namespace: ray-cluster
spec:
  # Automatically delete job after completion
  ttlSecondsAfterFinished: 3600
  shutdownAfterJobFinishes: true
  
  # Job entrypoint - simple GPU test first
  entrypoint: |
    python -c "
    import ray
    import torch
    
    ray.init()
    print(f'Ray resources: {ray.cluster_resources()}')
    
    @ray.remote(num_gpus=1)
    def check_gpu():
        import torch
        gpu_count = torch.cuda.device_count()
        gpu_name = torch.cuda.get_device_name(0) if gpu_count > 0 else 'None'
        memory = torch.cuda.get_device_properties(0).total_memory / 1e9 if gpu_count > 0 else 0
        return {'gpu_count': gpu_count, 'gpu_name': gpu_name, 'memory_gb': memory}
    
    # Test on each GPU worker
    futures = [check_gpu.remote() for _ in range(2)]
    results = ray.get(futures)
    for i, r in enumerate(results):
        print(f'Worker {i}: {r}')
    
    print('Ray GPU test completed successfully!')
    "
  
  # Runtime environment - using pre-installed packages in GPU worker image
  runtimeEnvYAML: |
    env_vars:
      HF_HOME: "/mnt/data/cache/huggingface"
      NCCL_DEBUG: "INFO"
    pip:
      - transformers==4.46.3
      - peft==0.13.2
      - accelerate==1.1.1
      - trl
      - datasets
  
  # Use existing Ray cluster
  clusterSelector:
    ray.io/cluster: ray-cluster

---
# ConfigMap with the training script
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-train-script
  namespace: ray-cluster
data:
  ray-train.py: |
    #!/usr/bin/env python3
    """
    Ray Train distributed fine-tuning for Llama-3 function calling.
    Uses Ray Train with PyTorch backend for multi-GPU training.
    """
    import os
    import ray
    from ray import train
    from ray.train import ScalingConfig, RunConfig, CheckpointConfig
    from ray.train.torch import TorchTrainer
    
    import torch
    from transformers import (
        AutoModelForCausalLM,
        AutoTokenizer,
        TrainingArguments,
    )
    from peft import LoraConfig, get_peft_model
    from trl import SFTTrainer
    from datasets import load_dataset
    
    # Configuration
    MODEL_NAME = "meta-llama/Meta-Llama-3-8B-Instruct"
    OUTPUT_DIR = "/mnt/data/checkpoints/llama3-function-calling-ray"
    TRAIN_DATA = "/mnt/data/datasets/train.jsonl"
    VAL_DATA = "/mnt/data/datasets/val.jsonl"
    
    LORA_CONFIG = LoraConfig(
        r=64,
        lora_alpha=128,
        lora_dropout=0.05,
        target_modules=["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"],
        bias="none",
        task_type="CAUSAL_LM",
    )
    
    def format_function_calling(example):
        """Format data for function calling training."""
        system = example.get("system", "You are a helpful assistant.")
        user = example.get("user", example.get("instruction", ""))
        assistant = example.get("assistant", example.get("output", ""))
        
        return {
            "text": f"<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\n{system}<|eot_id|>"
                   f"<|start_header_id|>user<|end_header_id|>\n\n{user}<|eot_id|>"
                   f"<|start_header_id|>assistant<|end_header_id|>\n\n{assistant}<|eot_id|>"
        }
    
    def train_func():
        """Training function executed on each worker."""
        # Get distributed training context
        world_size = train.get_context().get_world_size()
        rank = train.get_context().get_world_rank()
        local_rank = train.get_context().get_local_rank()
        
        print(f"Worker {rank}/{world_size} starting on local_rank {local_rank}")
        
        # Set device
        device = torch.device(f"cuda:{local_rank}")
        torch.cuda.set_device(device)
        
        # Load tokenizer
        tokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)
        tokenizer.pad_token = tokenizer.eos_token
        tokenizer.padding_side = "right"
        
        # Load model
        model = AutoModelForCausalLM.from_pretrained(
            MODEL_NAME,
            torch_dtype=torch.bfloat16,
            device_map={"": device},
        )
        
        # Apply LoRA
        model = get_peft_model(model, LORA_CONFIG)
        if rank == 0:
            model.print_trainable_parameters()
        
        # Load datasets
        train_data = load_dataset("json", data_files=TRAIN_DATA, split="train")
        val_data = load_dataset("json", data_files=VAL_DATA, split="train")
        
        train_data = train_data.map(format_function_calling)
        val_data = val_data.map(format_function_calling)
        
        # Training arguments
        training_args = TrainingArguments(
            output_dir=OUTPUT_DIR,
            num_train_epochs=3,
            per_device_train_batch_size=4,
            per_device_eval_batch_size=4,
            gradient_accumulation_steps=4,
            learning_rate=1.5e-4,
            lr_scheduler_type="cosine",
            warmup_ratio=0.03,
            weight_decay=0.01,
            logging_steps=10,
            save_steps=200,
            eval_strategy="steps",
            eval_steps=200,
            save_total_limit=3,
            bf16=True,
            gradient_checkpointing=True,
            dataloader_num_workers=4,
            ddp_find_unused_parameters=False,
            report_to="none",  # Disable wandb for now
        )
        
        # Create trainer
        trainer = SFTTrainer(
            model=model,
            args=training_args,
            train_dataset=train_data,
            eval_dataset=val_data,
            tokenizer=tokenizer,
            dataset_text_field="text",
            max_seq_length=2048,
            packing=False,
        )
        
        # Train
        trainer.train()
        
        # Save final model (only on rank 0)
        if rank == 0:
            trainer.save_model(f"{OUTPUT_DIR}/final")
            print(f"Model saved to {OUTPUT_DIR}/final")
        
        return {"status": "completed", "rank": rank}
    
    if __name__ == "__main__":
        # Initialize Ray (connects to existing cluster)
        ray.init()
        
        print(f"Ray cluster resources: {ray.cluster_resources()}")
        
        # Configure distributed training
        trainer = TorchTrainer(
            train_func,
            scaling_config=ScalingConfig(
                num_workers=2,           # 2 GPU nodes
                use_gpu=True,
                resources_per_worker={"GPU": 8, "CPU": 16},  # 8 GPUs per node
            ),
            run_config=RunConfig(
                name="llama3-finetuning",
                storage_path="/mnt/data/ray_results",
                checkpoint_config=CheckpointConfig(
                    num_to_keep=3,
                ),
            ),
        )
        
        # Run training
        result = trainer.fit()
        print(f"Training completed: {result}")

---
# Job to copy script to shared storage
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-ray-script
  namespace: ray-cluster
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: copy
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Copying Ray training script to shared storage..."
          cp /scripts/ray-train.py /mnt/data/ray-train.py
          chmod +x /mnt/data/ray-train.py
          echo "Done!"
          ls -la /mnt/data/ray-train.py
        volumeMounts:
        - name: script
          mountPath: /scripts
        - name: shared-data
          mountPath: /mnt/data
      volumes:
      - name: script
        configMap:
          name: ray-train-script
      - name: shared-data
        hostPath:
          path: /mnt/data
          type: Directory
