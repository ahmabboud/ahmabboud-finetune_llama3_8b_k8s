# Training Configuration for Llama-3 Function Calling Fine-tuning
# Optimized for 16x H100 (80GB) GPUs across 2 nodes

model:
  name: "meta-llama/Meta-Llama-3-8B-Instruct"
  use_lora: true
  use_flash_attention: true
  torch_dtype: "bfloat16"

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "/mnt/data/datasets/train.jsonl"
  val_path: "/mnt/data/datasets/val.jsonl"
  max_length: 2048

training:
  output_dir: "/mnt/data/checkpoints/llama3-function-calling"
  num_train_epochs: 3
  
  # Batch sizes optimized for H100 80GB with LoRA + Flash Attention
  # H100 80GB can handle much larger batches with LoRA (only ~20M trainable params)
  # Memory estimate: 8B model bf16 = ~16GB, LoRA adds ~1GB, batch scales rest
  # Effective batch size = per_device * gradient_accum * num_gpus
  # = 16 * 2 * 16 = 512 (good for LLM training stability)
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  
  # Learning rate schedule - slightly lower for larger batch
  learning_rate: 1.5e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  
  # Checkpointing
  save_steps: 200
  eval_steps: 200
  logging_steps: 10
  save_total_limit: 3
  
  # Memory optimization
  gradient_checkpointing: true
  # Enable torch compile for faster training (H100 supports it well)
  torch_compile: false  # Set true if PyTorch 2.0+ stable
  
  # Dataloader optimization
  dataloader_num_workers: 4
  dataloader_pin_memory: true

# Loss configuration
loss:
  # Only compute loss on assistant responses (not system/user prompts)
  # This focuses learning on generation, not memorizing prompts
  completion_only: true
  
  # Label smoothing for regularization (0.0 = disabled)
  label_smoothing: 0.0

# Evaluation configuration  
evaluation:
  # Run function-calling specific metrics every N eval steps
  run_generation_metrics: false  # Disabled by default (slow)
  generation_num_samples: 100    # Samples for generation eval
  
deepspeed:
  config_path: "src/training/deepspeed_config.json"

wandb:
  enabled: true
  project: "llama3-function-calling"
  run_name: "h100-16x-lora"
